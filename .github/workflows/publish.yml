name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # signs the provenance statement, and lets npm use trusted publishing once it's set up (D15, D33)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore caches in release builds
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # npm, not pnpm: trusted publishing needs npm CLI >= 11.5.1.
      - run: npm install --global npm@11
      # The first release can't use trusted publishing, because npm only lets you set it up on a
      # package that already exists. It uses the NPM_TOKEN secret instead; npm prefers trusted
      # publishing whenever it's configured, so the secret can be deleted afterwards (D33).
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
